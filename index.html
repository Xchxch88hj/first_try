<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Umbrella Corporation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            background: #0a0f1c;
            color: #e6f0ff;
        }

        /* 顶部导航 */
        header {
            background: rgba(0,0,0,0.6);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 150, 255, 0.3);
        }

        header h1 {
            color: #4da6ff;
            letter-spacing: 2px;
        }

        nav a {
            color: #cce6ff;
            margin-left: 20px;
            text-decoration: none;
        }

        nav a:hover {
            color: #4da6ff;
        }

        /* 首页大图 */
        .hero {
            height: 90vh;
            background: url('https://images.unsplash.com/photo-1581090700227-4c4c8c7b68f4?auto=format&fit=crop&w=1600&q=80') no-repeat center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .hero h2 {
            font-size: 48px;
            background: rgba(0,0,0,0.6);
            padding: 20px 40px;
            border: 1px solid rgba(77,166,255,0.5);
        }

        /* 内容区 */
        .section {
            padding: 60px 40px;
            text-align: center;
        }

        .section h3 {
            color: #4da6ff;
            margin-bottom: 20px;
        }

        .cards {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            width: 280px;
            border: 1px solid rgba(77,166,255,0.3);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #4da6ff;
        }

        /* 页脚 */
        footer {
            text-align: center;
            padding: 20px;
            border-top: 1px solid rgba(77,166,255,0.3);
            font-size: 14px;
            color: #aaa;
        }

        .warning {
            color: #ff4d4d;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>UMBRELLA</h1>
    <nav>
        <a href=" ">首页</a >
        <a href="#">研究领域</a >
        <a href="#">产品</a >
        <a href="#">关于我们</a >
    </nav>
</header>

<section class="hero">
    <h2>Our Business is Life Itself</h2>
</section>

<section class="section">
    <h3>核心研究领域</h3>
    <div class="cards">
        <div class="card">
            <h4>生物工程</h4>
            <p>先进基因重组技术，推动生命科学边界。</p >
        </div>
        <div class="card">
            <h4>病毒研究</h4>
            <p>探索未知病毒潜能，为人类进化提供可能。</p >
        </div>
        <div class="card">
            <h4>医药开发</h4>
            <p>致力于高效治疗方案与未来医疗体系。</p >
        </div>
    </div>
</section>

<section class="section">
    <h3>公司介绍</h3>
    <p>Umbrella Corporation 是全球领先的医药与生物科技企业，
    致力于为世界带来突破性的科学进展。</p >

    <p class="warning">⚠ 未授权访问将被记录</p >
</section>

<footer>
    © 2026 Umbrella Corporation. All Rights Reserved.
</footer>

</body>
</html>
